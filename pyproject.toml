[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "reviewpilot"
version = "0.1.0"
description = "AI code review GitHub Action with sandbox verification — the only reviewer that proves its suggestions work before posting them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AtharvPS13", email = "fake34811289@gmail.com" },
]
keywords = ["code-review", "github-action", "ai", "sandbox", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "unidiff>=0.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "litellm>=1.0.0",
    "instructor>=1.0.0",
    "docker>=7.0.0",
    "PyGithub>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
reviewpilot = "reviewpilot.cli:main"
reviewpilot-action = "reviewpilot.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewpilot"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
